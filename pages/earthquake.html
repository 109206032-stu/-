            <h2>發生時應對 (核心原則)</h2>
            <p>地震發生時，最重要的原則是保護頭部與頸部，避免被掉落物砸傷。請立即採取 <strong>「趴下、掩護、穩住」</strong> 的動作。</p>
            
            <div class="myth-buster">
                <h3>⚠️ 迷思破除：絕對不要尋找「黃金三角」</h3>
                <p>若房屋在地震中有倒塌危險時，<strong>不要躲在黃金三角區域，這是已經完全過時且致命的資訊。</strong> 正確的方式是直接躲到堅固的桌子下面，並雙手抱住後腦杓，握緊桌腳直到搖晃停止。</p>
            </div>
        </section>
